name: Build Raja Cheat APK

on:
  push:
    branches:
      - main
      - utama
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cek struktur project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          find app -maxdepth 8 -type f | sort

      - name: Buat Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK Debug
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Cari APK
        run: find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raja-Cheat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
